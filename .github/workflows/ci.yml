name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.41.5, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/check_openapi.dart openapi.json || true
        # openapi.json lấy từ artifact CI của labasset-api khi có; thiếu thì bỏ qua
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with: { name: apk-debug, path: build/app/outputs/flutter-apk/app-debug.apk }
